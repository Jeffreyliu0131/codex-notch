name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run unit tests
        run: swift test --enable-swift-testing --disable-xctest

      - name: Build debug targets
        run: swift build

      - name: Run synthetic fixture self-test
        run: swift run CodexNotchSelfTest
